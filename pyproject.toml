[project]
name = "risk-rl"
version = "0.0.2"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pettingzoo~=1.26.0",
    "numpy~=2.2.6",
    "torch~=2.12.0",
    "tianshou @ git+https://github.com/thu-ml/tianshou.git@master#egg=tianshou",
]

[project.optional-dependencies]
rocm = [
    "torch==2.12.0+rocm7.2 ; python_version == '3.13' and sys_platform == 'linux'",
    "triton-rocm==3.7.0 ; python_version == '3.13' and sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "rocm-index" }
triton-rocm = { index = "rocm-index" }

[[tool.uv.index]]
name = "rocm-index"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"